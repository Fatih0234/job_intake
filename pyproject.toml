[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-intake"
version = "0.1.0"
description = "Foundation scaffold for the Student Job Intake pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "notion-client>=2.3.0",
  "psycopg[binary]>=3.2.6",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.8.1",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "supabase>=2.13.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "types-PyYAML>=6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_intake"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
